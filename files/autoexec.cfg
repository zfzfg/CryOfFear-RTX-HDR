                       // ueber Weiss hinausgehen - genau die Reserve, die ein
                       // Tone-Expander braucht, um Highlights anzuheben.
                       // Kann das Gesamtbild aber spuerbar aufhellen und die
                       // beklemmende Dunkelheit des Spiels abschwaechen.

//gl_contrast    1.15   // Ab Werk 1.4. Der vorgebackene Kontrast klemmt Lichter
                       // schon in SDR ab, bevor RTX HDR sie sieht. Weniger
                       // Kontrast gibt dem Tone-Mapper mehr Spielraum -
                       // dieselbe Logik wie beim Contrast-Regler in Abschnitt 4.
