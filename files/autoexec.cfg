// ============================================================================
//  Cry of Fear - HDR- und 1440p-freundliche autoexec.cfg
//  Siehe HDRmodCOF.md Abschnitt 5
//
//  Ablage: ...\steamapps\common\Cry of Fear\cryoffear\autoexec.cfg
//
//  WICHTIG: Dies ist eine ZUSAMMENFUEHRUNG. Der obere Block sind die
//  Original-Zeilen aus der mitgelieferten autoexec.cfg von Cry of Fear 1.6 -
//  die duerfen nicht verlorengehen (Bewegungsgeschwindigkeit, Voice-Codec).
//  Der untere Block ist neu. Vorher Original sichern.
// ============================================================================

// ---- Original-Zeilen aus Cry of Fear 1.6 (unveraendert lassen) -------------
sv_maxspeed 300
sv_cheats 0
r_dynamiclight 0
cl_noiseeffect 1
cl_sidespeed 200
cl_backspeed 200
gl_max_size 1024
sv_voicecodec voice_speex
sv_voicequality 5
sv_lan 0

// ---- HDR-Anpassungen -------------------------------------------------------

// Renderer ------------------------------------------------------------------
gl_renderer     1      // Paranoia-Renderer AN. Mit 0 fehlt das Licht von
                       // Taschenlampe und Handy komplett - also genau die
                       // Highlights, die HDR sichtbar machen soll.
                       // Steht bewusst NICHT in der Original-autoexec.
gl_twopassdyn   1      // Zweipass-Dynamiklicht. Auf 0, falls Z-Fighting oder
                       // Lichtartefakte auftreten.

// Gamma / Helligkeit --------------------------------------------------------
// brightness und gamma laufen ueber die Hardware-Gammarampe. Windows ignoriert
// die unter HDR, im Fenstermodus tut sie ohnehin nichts. Hier bewusst auf den
// Originalwerten fixiert, damit sie das Bild fuer RTX HDR nicht verfaelschen.
brightness      1
gamma           2.5

// gl_brightness und gl_gamma gehoeren dagegen dem Paranoia-Renderer und werden
// hoechstwahrscheinlich im Renderer selbst angewandt, nicht ueber die Rampe -
// sie koennten also unter HDR weiterhin wirken. Das ist der einzige Hebel, um
// das Grundbild anzuheben, wenn der Middle-Grey-Regler fehlt (Route 3B).
// Ungetestet: erst auf Originalwerten lassen, dann in kleinen Schritten testen.
gl_brightness   0      // Original 0.000000; testweise 0.05 - 0.15 probieren
gl_gamma        1      // Original 1

// Post-Effekte --------------------------------------------------------------
gl_posteffects  1      // Behaelt die gewollten S/W- und Nightmare-Effekte.
                       // Statt auf 0 zu setzen, laesst sich der Effekt auch
                       // abschwaechen: cryoffear\cgshaders\black_fp.cg ist ein
                       // editierbarer Cg-Shader. Siehe HDRmodCOF.md Abschnitt 9.

// ---- Anpassungen fuer hohe Aufloesungen (1440p) ----------------------------

// Texturfilterung -----------------------------------------------------------
gl_texturemode  gl_linear_mipmap_linear   // Wie im Original. Trilinear
                       // reduziert Mip-Flimmern, das ein Tone-Expander sonst
                       // zu Funkeln auf fernen hellen Flaechen verstaerkt.
                       // Anisotrope Filterung kann die Engine nicht - die wird
                       // ueber das NVIDIA-Profil erzwungen (16x).

// r_detailtextures wurde hier bewusst WIEDER ENTFERNT. Das Spiel bringt keine
// einzige *_detail.txt mit (nachgezaehlt: null), die Engine meldet dann nur
// "No detail texture mapping file" und macht weiter. Die Zeile brachte also
// garantiert nichts und stand trotzdem unter Absturzverdacht - eine Aenderung
// ohne Nutzen gehoert nicht in eine Konfiguration.

// Sichtfeld -----------------------------------------------------------------
cl_fovmultiplier 1.15  // CoF-eigener FOV-Regler (~104° auf 16:9). Perfekter Sweetspot:
                       // behebt das enge 4:3-Gefuehl ohne Verzerrung an den Raendern.
                       // Alternativen: 1.0 (Standard), 1.10 (dezent), 1.20 (sehr weit).


// ---- Maus & Reaktionszeit / Latenz -----------------------------------------
// m_filter 0 schaltet das alte GoldSrc-Mausglaetten (Interpolation zweier Frames)
// ab. Dadurch reagiert das Fadenkreuz absolut direkt und ohne fuehlbaren Input-Lag.
m_filter        0

// Die Startoptionen -noforcemparms -noforcemaccel -noforcemspd gehoeren zwingend
// dazu (siehe README). Ohne sie schaltet Windows die Zeigerbeschleunigung wieder ein.

// Taktung fuer schnellste Eingabeverarbeitung bei 100 FPS
cl_cmdrate      101
cl_updaterate   101
rate            100000

// ---- Framerate & Synchronisation -------------------------------------------
// Der 100er-Deckel ist in dieser Pre-SteamPipe-Engine fest einkompiliert.
fps_max         100

// gl_vsync auf 0: Auf modernen VRR/G-Sync-Monitoren (300 Hz) verhindert G-Sync
// Tearing vollautomatisch, waehrend gl_vsync 0 jeglichen VSync-Eingabepuffer-Lag
// komplett eliminiert. Maximale Reaktionsgeschwindigkeit.
gl_vsync        0

// ---- Konsole ---------------------------------------------------------------
developer       0      // Debug-Ausgaben werden mit ins Bild gezeichnet und
                       // damit vom Tone-Expander mit aufgehellt.

// ============================================================================
//  TESTEINTRAEGE - bewusst auskommentiert
//
//  Beide veraendern den Bildlook deutlich. Sie sind hier dokumentiert, weil sie
//  die zwei wirksamsten verbliebenen HDR-Stellschrauben im Spiel selbst sind -
//  aber ob man sie will, ist eine Geschmacksentscheidung, keine Voreinstellung.
//  Jeweils einzeln aktivieren und dieselbe Szene vorher/nachher vergleichen.
// ============================================================================

